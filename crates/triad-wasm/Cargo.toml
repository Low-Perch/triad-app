[package]
name = "triad-wasm"
version = "0.1.0"
edition = "2021"
description = "WASM bindings for the Triad word puzzle game engine"
repository = "https://github.com/cdrani/triad"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
triad-core = { path = "../triad-core" }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
getrandom = { version = "0.3", features = ["wasm_js"] }
console_error_panic_hook = "0.1"
